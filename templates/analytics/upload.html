{% extends "base.html" %}
{% block content %}

<div class="page-head">
  <div>
    <h1>Завантажити лог-файл</h1>
    <div class="meta">Підтримується формат Apache / Nginx Combined Log Format</div>
  </div>
</div>

<div class="panel" style="max-width:640px;">
  <div class="panel-body">
    <form method="post" enctype="multipart/form-data" class="form-row" style="flex-direction:column; align-items:stretch;">
      {% csrf_token %}
      <div class="field">
        <label>Назва (необов'язково)</label>
        <input type="text" name="name" placeholder="напр. production-2024-06">
      </div>
      <div class="field">
        <label>Файл</label>
        <input type="file" name="file" required>
      </div>
      <div style="margin-top:16px;">
        <button type="submit" class="btn btn-primary">Завантажити та обробити</button>
      </div>
    </form>
  </div>
</div>

<div class="panel" style="max-width:640px;">
  <div class="panel-body">
    <h4 style="margin-bottom:8px;">Очікуваний формат</h4>
    <pre style="font-family:var(--font-mono); font-size:11px; background:var(--surface-2); padding:12px; overflow-x:auto; border:1px solid var(--line); margin:0;">192.168.1.10 - - [10/Oct/2023:13:55:36 +0300] "GET / HTTP/1.1" 200 2326 "http://example.com/" "Mozilla/5.0 ..."</pre>
  </div>
</div>

{% endblock %}
